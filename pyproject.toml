[project]
name = "ibm-rag-agentic-ai"
version = "0.1.0"
description = "Coursera IBM RAG and Agentic AI Professional Certificate: study code and notebooks"
readme = "README.md"
authors = [
    { name = "Sree R One", email = "sreeraj_ec@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ibm>=0.1.7",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "openai>=1.0.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
