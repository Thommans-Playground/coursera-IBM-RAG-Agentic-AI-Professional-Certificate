description = "Coursera IBM RAG and Agentic AI Professional Certificate: study code and notebooks"
readme = "README.md"
authors = [
    { name = "Sree R One", email = "sreeraj_ec@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ibm>=0.1.7",
    "langchain-openai>=1.7.2",
