id: eu-ai-act
name: Regulation (EU) 2024/1689, the EU Artificial Intelligence Act
kind: LAW                       # binding, enforced, with penalties
scope_level: PRODUCT_AND_ORGANISATION   # obligations fall on roles (provider, deployer, ...) and depend on risk tier
version: "Consolidated text as at 2026-07-27 (original: OJ L, 2024/1689, 12.7.2024; amended by the Digital Omnibus on AI)"
publisher: European Union
levels: [chapter, section, article, paragraph, point, subpoint]    # annexes: annex, annex-section, paragraph, point; Art. 3 definitions: item
counts: {chapter: 13, section: 16, article: 119, annex: 14, annex-section: 7}
text_policy: PUBLIC             # EU legal text; reuse allowed with attribution (Commission Decision 2011/833/EU)
as_of: 2026-10-24
sources:
  - id: ai-act-service-desk
    title: AI Act Service Desk, European Commission - article and annex pages
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/
    role: text and structure. Says it is based on the EUR-Lex consolidated version as at 27 July 2026, with Digital Omnibus changes marked NEW / AMENDED / DELETED
    limits: a reading aid, not the authentic text. The authentic text is the Official Journal. Recitals not included
kinds: {GROUP: heading, OBLIGATION: article text, DEFINITION: Art. 3 items, LIST_ENTRY: annex lists, DELETED: removed by the Omnibus}
ids: >
  Official citation. Articles Art.9, paragraphs Art.9(2), points Art.9(2)(a), sub-points Art.5(1)(h)(i).
  Articles without numbered paragraphs use points directly (Art.16(a)). Annexes: Annex.III, Annex.III(1)(a).
  Where an article has two lists with the same lettering under one paragraph the second gets [2] (Art.43(1)(a)[2]).
  Annexes with Sections A/B/C add an annex-section level: Annex.VIII.A(1).
new_articles_from_omnibus: [4a, 60a, 75a, 75b, 75c, 75d]
facets:
  digital_omnibus: new / amended / deleted, where the consolidated text marks a change
  applies_from: derived from Art. 113 of the consolidated text by chapter. Chapter III sections 1-3 have two dates (Annex III systems 2027-12-02, Annex I systems 2028-08-02)
statuses:
  verified-consolidated: text taken from the Commission's consolidated reading text; not yet reviewed by a person against the Official Journal
known_gaps:
  - recitals not included
  - Articles 81, 85, 94 were retrieved late; included
  - applies_from for the six articles the Omnibus added (4a, 60a, 75a-75d) is derived from their chapter and not confirmed; the Omnibus may set its own date
  - role and risk-tier tags (the sheet's "Applies To" and risk tier) are not imported; they belong to the applicability rules
review_log:
